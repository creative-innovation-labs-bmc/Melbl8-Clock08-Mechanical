<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <title>Melbl8 Clock08 Mechanical 5x3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="clock">
  <div id="viewport">
    <main id="stage" aria-label="Mechanical wall clock showing time">
      <section id="time-panel" class="time-panel" aria-label="Time">
        <div class="time-group" id="hours"></div>
        <div class="colon" aria-hidden="true">
          <span class="colon-clock"><i class="colon-hand"></i></span>
          <span class="colon-clock"><i class="colon-hand"></i></span>
        </div>
        <div class="time-group" id="minutes"></div>
        <div class="colon" aria-hidden="true">
          <span class="colon-clock"><i class="colon-hand"></i></span>
          <span class="colon-clock"><i class="colon-hand"></i></span>
        </div>
        <div class="time-group" id="seconds"></div>
      </section>
      <div id="debug" hidden></div>
    </main>
  </div>

  <script src="clock.js"></script>
</body>
</html>
