<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <title>Melbl8 Clock08 Mechanical</title>
  <link rel="stylesheet" href="style-v3.css" />
</head>
<body data-page="clock-v3">
  <div id="viewport">
    <main id="stage" aria-label="Mechanical wall clock">
      <div id="edge-left" class="edge-copy edge-copy--left">00:00:00 · Friday 14 August 2026</div>
      <div id="edge-right" class="edge-copy edge-copy--right">Docklands · 17.4° · Weather placeholder</div>

      <section class="time-panel" aria-label="Mechanical HH MM SS time display">
        <div class="time-group" id="hours"></div>
        <div id="colon-1" aria-hidden="true"></div>
        <div class="time-group" id="minutes"></div>
        <div id="colon-2" aria-hidden="true"></div>
        <div class="time-group" id="seconds"></div>
      </section>

      <div id="debug" hidden></div>
    </main>
  </div>
  <script src="clock-v3.js"></script>
</body>
</html>
