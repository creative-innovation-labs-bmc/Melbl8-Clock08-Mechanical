<!doctype html>
<html lang="en-AU" data-shape="leaf">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <title>Melbourne Mechanical Leaf Clock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="viewport">
    <main id="stage" aria-label="Mechanical leaf clock showing Melbourne time">
      <section class="side-panel side-panel--left" aria-label="Day">
        <div class="side-label">DAY</div>
        <div id="day-word" class="matrix-word"></div>
      </section>

      <section id="time-panel" class="time-panel" aria-label="Time">
        <div class="time-group" id="hours"></div>
        <div class="colon" aria-hidden="true">
          <span class="colon-clock"><i class="colon-hand"></i></span>
          <span class="colon-clock"><i class="colon-hand"></i></span>
        </div>
        <div class="time-group" id="minutes"></div>
        <div class="colon" aria-hidden="true">
          <span class="colon-clock"><i class="colon-hand"></i></span>
          <span class="colon-clock"><i class="colon-hand"></i></span>
        </div>
        <div class="time-group" id="seconds"></div>
      </section>

      <section class="side-panel side-panel--right" aria-label="Location">
        <div class="side-label">LOCATION</div>
        <div id="location-word" class="matrix-word"></div>
      </section>

      <div id="debug" hidden></div>
    </main>
  </div>

  <script src="clock.js"></script>
</body>
</html>
